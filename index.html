<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Gráficas de Sensores</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .chart {
        margin-bottom: 30px;
      }
      #update-info {
        font-size: 16px;
        margin-bottom: 15px;
      }
      button {
        padding: 8px 16px;
        font-size: 14px;
        margin-bottom: 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Gráficas de Sensores</h1>
    <div id="update-info">Última actualización: --</div>
    <button onclick="drawCharts()">Actualizar Ahora</button>

    <div id="chart1" class="chart"></div>
    <div id="chart2" class="chart"></div>
    <div id="chart3" class="chart"></div>
    <div id="chart4" class="chart"></div>
    <div id="chart5" class="chart"></div>
    <div id="chart6" class="chart"></div>
    <div id="chart7" class="chart"></div>
    <div id="chart8" class="chart"></div>
    <div id="chart9" class="chart"></div>
    <div id="chart10" class="chart"></div>
    <div id="chart11" class="chart"></div>
    <div id="chart12" class="chart"></div>

        <script>
      google.charts.load("current", { packages: ["corechart"] });
    
      const SHEET_ID = "1HC4jC-g0dJIbHS9YsIqtR5oNKxYEp6yepOSFIi85HL4";
      const GID = "0";
    
      google.charts.setOnLoadCallback(() => {
        drawCharts();
        setInterval(drawCharts, 10000);
      });
    
      function toNumber(value) {
        if (value === null || value === undefined || value === "" || value === "NaN") {
          return null;
        }
    
        const n = Number(value);
        return Number.isFinite(n) ? n : null;
      }
    
      function drawCharts() {
        const queryText = "select B,C,D,E,F,G,H,I,J,K,L";
    
        const url =
          "https://docs.google.com/spreadsheets/d/" +
          SHEET_ID +
          "/gviz/tq?gid=" +
          GID +
          "&headers=1&tq=" +
          encodeURIComponent(queryText);
    
        const query = new google.visualization.Query(url);
    
        query.send(function (response) {
          if (response.isError()) {
            document.getElementById("update-info").innerText =
              "Error al leer la hoja: " +
              response.getMessage() +
              " " +
              response.getDetailedMessage();
            return;
          }
    
          const table = response.getDataTable();
    
          const tiempos = [];
          const sensores = Array.from({ length: 10 }, () => []);
    
          for (let r = 0; r < table.getNumberOfRows(); r++) {
            const tiempo = toNumber(table.getValue(r, 0));
    
            if (tiempo !== null) {
              tiempos.push(tiempo);
    
              for (let i = 0; i < 10; i++) {
                const temp = toNumber(table.getValue(r, i + 1));
                sensores[i].push([tiempo, temp]);
              }
            }
          }
    
          if (tiempos.length === 0) {
            document.getElementById("update-info").innerText =
              "La hoja fue leída, pero no hay datos numéricos para graficar.";
            return;
          }
    
          // Gráfico 1: todos los sensores vs tiempo
          const data1 = new google.visualization.DataTable();
          data1.addColumn("number", "Tiempo (s)");
    
          for (let i = 0; i < 10; i++) {
            data1.addColumn("number", `Sensor ${i + 1}`);
          }
    
          for (let j = 0; j < tiempos.length; j++) {
            const fila = [tiempos[j]];
    
            for (let i = 0; i < 10; i++) {
              fila.push(sensores[i][j]?.[1] ?? null);
            }
    
            data1.addRow(fila);
          }
    
          drawChart(data1, "chart1", "Perfil de Temperaturas vs Tiempo");
    
          // Gráfico 2: perfil instantáneo
          const data2 = new google.visualization.DataTable();
          data2.addColumn("number", "Sensor");
          data2.addColumn("number", "Temperatura (°C)");
    
          for (let i = 0; i < 10; i++) {
            const ultima = sensores[i][sensores[i].length - 1]?.[1] ?? null;
            data2.addRow([i + 1, ultima]);
          }
    
          drawChart(data2, "chart2", "Perfil Instantáneo de Temperatura", "scatter");
    
          // Gráficos individuales
          for (let i = 0; i < 10; i++) {
            const data = new google.visualization.DataTable();
            data.addColumn("number", "Tiempo (s)");
            data.addColumn("number", `Sensor ${i + 1}`);
    
            sensores[i].forEach(([t, v]) => {
              data.addRow([t, v]);
            });
    
            drawChart(data, `chart${i + 3}`, `Sensor ${i + 1} vs Tiempo`);
          }
    
          const now = new Date();
          const formatted = now.toLocaleTimeString("es-CO", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
    
          document.getElementById("update-info").innerText =
            "Última actualización: " + formatted;
        });
      }
    
      function drawChart(data, elementId, title, type = "line") {
        const options = {
          title: title,
          height: 300,
          legend: { position: "bottom" },
          hAxis: {
            title: data.getColumnLabel(0),
          },
          vAxis: {
            title: data.getColumnLabel(1),
          },
          interpolateNulls: false,
        };
    
        const chart =
          type === "scatter"
            ? new google.visualization.ScatterChart(document.getElementById(elementId))
            : new google.visualization.LineChart(document.getElementById(elementId));
    
        chart.draw(data, options);
      }
    </script>
  </body>
</html>
